name: desktop

# Builds the Windows installer on a windows-latest runner, so the developer
# machine needs nothing but git.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    paths:
      - "apps/client/**"
      - ".github/workflows/desktop.yml"

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/client/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.kaarvand.cloud' }}

      - name: Package installer
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: kaarvand-windows-installer
          path: apps/client/release/*.exe
          if-no-files-found: error

      - name: Attach installer to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/client/release/*.exe
